name: XNU Native Local Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-xnu:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Toolchain
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          
          # Create required perl stub if missing in SDK
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          LIBEXEC_DIR="$SDK_PATH/usr/local/libexec"
          sudo mkdir -p "$LIBEXEC_DIR"
          printf '#!/usr/bin/env perl\nuse strict;\nuse warnings;\n1;\n' | sudo tee "$LIBEXEC_DIR/availability.pl" > /dev/null
          sudo chmod +x "$LIBEXEC_DIR/availability.pl"
        shell: bash

      - name: Clone Apple XNU Source (Ventura Tag)
        run: |
          git clone --depth=1 https://github.com/apple-oss-distributions/xnu.git xnu-source
          cd xnu-source
          git fetch origin tag xnu-8792.41.9 --depth=1
          git checkout xnu-8792.41.9
        shell: bash

      - name: Phase 1 - Stage Export Headers (installhdrs)
        run: |
          cd xnu-source
          make SDKROOT=macosx ARCH_CONFIGS=X86_64 installhdrs
        shell: bash

      - name: Phase 2 - Compile Release Kernel Target
        run: |
          cd xnu-source
          make SDKROOT=macosx \
               KERNEL_CONFIGS=RELEASE \
               ARCH_CONFIGS=X86_64 \
               RC_DARWIN_KERNEL_VERSION="22.0.0"
        shell: bash

      - name: Archive Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-compiled-kernel
          path: |
            xnu-source/BUILD/**/*.kernel*
            xnu-source/BUILD/**/*.dSYM*
            xnu-source/BUILD/**/*.map
          if-no-files-found: warn
