name: XNU Fixed Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-xnu:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Xcode Toolchain and SDK Fixes
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)

          LIBEXEC_DIR="$SDK_PATH/usr/local/libexec"
          sudo mkdir -p "$LIBEXEC_DIR"
          printf '#!/usr/bin/env perl\nuse strict;\nuse warnings;\n1;\n' | sudo tee "$LIBEXEC_DIR/availability.pl" > /dev/null
          sudo chmod +x "$LIBEXEC_DIR/availability.pl"
        shell: bash

      - name: Clone Apple XNU Source (Ventura Tag)
        run: |
          git clone --depth=1 https://github.com/apple-oss-distributions/xnu.git xnu-source
          cd xnu-source
          git fetch origin tag xnu-8792.41.9 --depth=1
          git checkout xnu-8792.41.9
        shell: bash

      - name: Clone libdispatch (real firehose headers)
        run: |
          git clone --depth=1 https://github.com/apple-oss-distributions/libdispatch.git libdispatch
          echo "Firehose-related headers found:"
          find libdispatch \( -name 'firehose*.h' -o -name 'chunk_private.h' \) | sort
        shell: bash

      - name: Phase 1 - Stage and Install Export Headers
        run: |
          cd xnu-source
          make SDKROOT=macosx ARCH_CONFIGS=X86_64 installhdrs
        shell: bash

      - name: Phase 2 Setup - Stub library, include flags, compiler wrapper
        run: |
          cd xnu-source
          mkdir -p custom_stubs/lib custom_stubs/bin

          # 1. Include flags pointing at the REAL firehose headers (no fake structs)
          #    Copy ONLY firehose headers into a staging dir and add it with
          #    -idirafter so it can never shadow SDK/XNU headers (e.g. os/object.h).
          LD_ROOT="$GITHUB_WORKSPACE/libdispatch"
          STAGE="$PWD/custom_stubs/firehose_include"
          mkdir -p "$STAGE/firehose" "$STAGE/os"
          while IFS= read -r f; do
            cp -n "$f" "$STAGE/firehose/" 2>/dev/null || true
            if [ "$(basename "$(dirname "$f")")" = "os" ]; then
              cp -n "$f" "$STAGE/os/" 2>/dev/null || true
            fi
          done < <(find "$LD_ROOT" \( -name 'firehose*.h' -o -name 'chunk_private.h' \))
          echo "-idirafter $STAGE -idirafter $STAGE/firehose" > custom_stubs/include_flags
          echo "Staged headers:"; find "$STAGE" -type f | sort

          # 2. Stub implementations ONLY for symbols that don't exist anywhere.
          #    No header is included, so nothing can shadow the real definitions.
          cat << 'EOF' > custom_stubs/lib/stubs_impl.c
          #include <stddef.h>
          #include <stdint.h>

          void *__os_log_default = NULL;
          void *__os_log_internal = NULL;
          void *__os_log_internal_driverKit = NULL;
          char *__aslbufp = NULL;
          char *__msgbufp = NULL;
          _Bool startup_serial_logging_active = 0;
          uint64_t startup_serial_num_procs = 0;

          void __dummy_firehose(void) {}
          void _firehose_trace_metadata(void) {}
          void _log_dmesg(void) {}
          void _log_payload_send(void) {}
          void _log_putc(void) {}
          void _log_putc_locked(void) {}
          void _logclose(void) {}
          void _logioctl(void) {}
          void _logopen(void) {}
          void _logread(void) {}
          void _logselect(void) {}
          void _logwakeup(void) {}
          void _os_log_create(void) {}
          void _os_log_disabled(void) {}
          void _os_log_with_args(void) {}
          void _oslogclose(void) {}
          void _oslogioctl(void) {}
          void _oslogopen(void) {}
          void _oslogselect(void) {}
          int __firehose_kernel_configuration_valid(uint64_t chunks, uint64_t iopages) { return 1; }
          void *__firehose_buffer_create(size_t *size) { return NULL; }
          _Bool __firehose_merge_updates(void) { return 0; }
          EOF

          clang -c custom_stubs/lib/stubs_impl.c -o custom_stubs/lib/stubs_impl.o
          ar rcs custom_stubs/lib/libcustom_stubs.a custom_stubs/lib/stubs_impl.o
          rm custom_stubs/lib/stubs_impl.c custom_stubs/lib/stubs_impl.o

          # 3. Compiler wrapper
          #    - assembly: passed through untouched (no stub flags, no -include)
          #    - C/C++ compile: adds real firehose include paths + relaxed warnings
          #    - link (no -c/-E/-S): appends the stub library
          cat << 'EOF' > custom_stubs/bin/clang-wrapper
          #!/bin/bash
          SELF_DIR="$(cd "$(dirname "$0")/.." && pwd)"
          REAL=/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin
          TOOL=clang
          [[ "$(basename "$0")" == *"++"* ]] && TOOL=clang++

          ARGS=()
          IS_ASM=0
          IS_COMPILE=0
          PREV=""
          for arg in "$@"; do
            case "$arg" in
              -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang) continue ;;
              *.s|*.S) IS_ASM=1 ;;
              assembler|assembler-with-cpp) [ "$PREV" = "-x" ] && IS_ASM=1 ;;
              -c|-E|-S|-M|-MM) IS_COMPILE=1 ;;
            esac
            PREV="$arg"
            ARGS+=("$arg")
          done

          if [ "$IS_ASM" -eq 1 ]; then
            exec "$REAL/$TOOL" "${ARGS[@]}"
          fi

          if [ "$IS_COMPILE" -eq 1 ]; then
            read -r -a EXTRA < "$SELF_DIR/include_flags"
            exec "$REAL/$TOOL" -w -Wno-error "${EXTRA[@]}" "${ARGS[@]}"
          fi

          # link step
          exec "$REAL/$TOOL" "${ARGS[@]}" "$SELF_DIR/lib/libcustom_stubs.a"
          EOF
          chmod +x custom_stubs/bin/clang-wrapper
          ln -sf clang-wrapper custom_stubs/bin/clang
          ln -sf clang-wrapper custom_stubs/bin/clang++
        shell: bash

      - name: Phase 2 - Build XNU Kernel Target
        run: |
          cd xnu-source
          STUB_PATH="$PWD/custom_stubs"
          export PATH="$STUB_PATH/bin:$PATH"
          export CC="$STUB_PATH/bin/clang"
          export CXX="$STUB_PATH/bin/clang++"

          make SDKROOT=macosx \
               KERNEL_CONFIGS=RELEASE \
               ARCH_CONFIGS=X86_64 \
               RC_DARWIN_KERNEL_VERSION="22.0.0" \
               CC="$CC" CXX="$CXX" \
               BUILD_WERROR=0 \
               build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
        shell: bash

      - name: Show first errors (only on failure)
        if: failure()
        run: |
          echo "=== First error-looking lines ==="
          grep -n -E "error:|fatal error|undefined|Undefined|No such file|command not found|ld: |\*\*\* \[" build.log | head -60
          echo "=== 40 lines before the first make *** line ==="
          N=$(grep -n -m1 '\*\*\* \[' build.log | cut -d: -f1)
          [ -n "$N" ] && sed -n "$((N>40 ? N-40 : 1)),${N}p" build.log
        shell: bash

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-log
          path: build.log
          if-no-files-found: warn

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-artifacts
          path: |
            xnu-source/BUILD/**/*.kernel*
            xnu-source/BUILD/**/*.dSYM*
            xnu-source/BUILD/**/*.map
          if-no-files-found: warn
