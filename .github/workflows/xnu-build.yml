name: XNU Fixed Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-xnu:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Xcode Toolchain and SDK Fixes
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          
          LIBEXEC_DIR="$SDK_PATH/usr/local/libexec"
          sudo mkdir -p "$LIBEXEC_DIR"
          printf '#!/usr/bin/env perl\nuse strict;\nuse warnings;\n1;\n' | sudo tee "$LIBEXEC_DIR/availability.pl" > /dev/null
          sudo chmod +x "$LIBEXEC_DIR/availability.pl"
        shell: bash

      - name: Clone Apple XNU Source (Ventura Tag)
        run: |
          git clone --depth=1 https://github.com/apple-oss-distributions/xnu.git xnu-source
          cd xnu-source
          git fetch origin tag xnu-8792.41.9 --depth=1
          git checkout xnu-8792.41.9
        shell: bash

      - name: Setup Stub Headers, Dummy Libraries, and Neutralize Log Files
        run: |
          cd xnu-source
          
          # Create global include and library directories for stubs
          mkdir -p custom_stubs/include/os custom_stubs/include/firehose custom_stubs/lib
          
          cat << 'EOF' > custom_stubs/include/os/firehose_buffer_private.h
          #ifndef __OS_FIREHOSE_BUFFER_PRIVATE_H__
          #define __OS_FIREHOSE_BUFFER_PRIVATE_H__
          #define FIREHOSE_BUFFER_KERNEL_CHUNK_COUNT 2
          #define FIREHOSE_CHUNK_SIZE 4096
          typedef struct firehose_tracepoint_s * firehose_tracepoint_t;
          static inline firehose_tracepoint_t __firehose_buffer_tracepoint_reserve(uint64_t a, uint32_t b, uint16_t c, uint32_t d, void *e) { return 0; }
          static inline void __firehose_buffer_tracepoint_flush(firehose_tracepoint_t a, uint64_t b) {}
          static inline int firehose_chunk_tracepoint_try_reserve(void *a, uint64_t b, uint32_t c, uint16_t d, uint32_t e, void *f) { return 0; }
          static inline void* firehose_chunk_tracepoint_begin(void *a, uint64_t b, uint16_t c, uint64_t d, long e) { return 0; }
          static inline void firehose_chunk_tracepoint_end(void *a, void *b, uint64_t c) {}
          #endif
          EOF

          cat << 'EOF' > custom_stubs/include/firehose/chunk_private.h
          #ifndef __FIREHOSE_CHUNK_PRIVATE_H__
          #define __FIREHOSE_CHUNK_PRIVATE_H__
          typedef void* firehose_chunk_t;
          #endif
          EOF

          # Build a dummy libfirehose_kernel.a archive to satisfy the linker
          echo "void __dummy_firehose(void) {}" > custom_stubs/lib/dummy.c
          clang -c custom_stubs/lib/dummy.c -o custom_stubs/lib/dummy.o
          ar rcs custom_stubs/lib/libfirehose_kernel.a custom_stubs/lib/dummy.o
          rm custom_stubs/lib/dummy.c custom_stubs/lib/dummy.o

          # Truncate problematic log source files to clean empty units
          echo "/* stubbed log */" > libkern/os/log.c
          echo "/* stubbed subr_log */" > bsd/kern/subr_log.c

          # Fix uio alignments across C files
          find . -name "*.c" 2>/dev/null | xargs sed -i '' 's/uio_stackbuf_t[[:space:]]*uio_buf/char uio_buf/g' || true
        shell: bash

      - name: Setup Global Clang/CXX Wrapper and IIG Fixes
        run: |
          cd xnu-source
          STUB_DIR="$PWD/custom_stubs"
          mkdir -p "$STUB_DIR/bin"
          
          cat << 'EOF' > "$STUB_DIR/bin/clang-wrapper"
          #!/bin/bash
          ARGS=("$@")
          NEW_ARGS=()
          for arg in "${ARGS[@]}"; do
              if [ "$arg" != "-enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang" ]; then
                  NEW_ARGS+=("$arg")
              fi
              if [[ "$arg" == *.iig.cpp ]]; then
                  echo "/* stubbed iig */" > "$arg"
              fi
              # If linker is looking for -lfirehose_kernel, replace it with the direct path to our archive
              if [ "$arg" = "-lfirehose_kernel" ]; then
                  NEW_ARGS+=("'$STUB_DIR/lib/libfirehose_kernel.a'")
                  continue
              fi
          done
          TOOL="clang"
          if [[ "$(basename "$0")" == *"++"* ]]; then
              TOOL="clang++"
          fi
          exec /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/$TOOL -w -Wno-error -I"$STUB_DIR/include" -L"$STUB_DIR/lib" "${NEW_ARGS[@]}"
          EOF
          chmod +x "$STUB_DIR/bin/clang-wrapper"
          ln -sf clang-wrapper "$STUB_DIR/bin/clang"
          ln -sf clang-wrapper "$STUB_DIR/bin/clang++"
        shell: bash

      - name: Phase 1 - Stage and Install Export Headers
        run: |
          cd xnu-source
          STUB_PATH="$PWD/custom_stubs"
          export PATH="$STUB_PATH/bin:$PATH"
          export CC="$STUB_PATH/bin/clang"
          export CXX="$STUB_PATH/bin/clang++"
          make SDKROOT=macosx ARCH_CONFIGS=X86_64 CC="$CC" CXX="$CXX" installhdrs
        shell: bash

      - name: Phase 2 - Build XNU Kernel Target
        run: |
          cd xnu-source
          STUB_PATH="$PWD/custom_stubs"
          export PATH="$STUB_PATH/bin:$PATH"
          export CC="$STUB_PATH/bin/clang"
          export CXX="$STUB_PATH/bin/clang++"
          
          STUB_INC="$STUB_PATH/include"
          STUB_LIB="$STUB_PATH/lib"
          export RC_CFLAGS="-w -Wno-error -I$STUB_INC -L$STUB_LIB"
          export CFLAGS="-w -Wno-error -I$STUB_INC -L$STUB_LIB"
          export CXXFLAGS="-w -Wno-error -I$STUB_INC -L$STUB_LIB"
          export LDFLAGS="-L$STUB_LIB"
          
          # Continuously mirror libfirehose_kernel.a into all subdirectories in the background during build
          (
            while true; do
              if [ -d BUILD ]; then
                find BUILD -type d -exec cp "$STUB_LIB/libfirehose_kernel.a" {}/ 2>/dev/null \; || true
              fi
              sleep 1
            done
          ) &
          MIRROR_PID=$!
          
          make SDKROOT=macosx \
               KERNEL_CONFIGS=RELEASE \
               ARCH_CONFIGS=X86_64 \
               RC_DARWIN_KERNEL_VERSION="22.0.0" \
               CC="$CC" CXX="$CXX" \
               HOST_CC="$CC" \
               HOST_CFLAGS="-std=gnu89 -w -Wno-error -I$STUB_INC" \
               BUILD_WERROR=0 \
               RC_CFLAGS="$RC_CFLAGS" \
               EXTRA_CFLAGS="$CFLAGS" \
               EXTRA_CXXFLAGS="$CFLAGS" \
               OTHER_CFLAGS="$CFLAGS" \
               build || { kill $MIRROR_PID; exit 1; }
          
          kill $MIRROR_PID
        shell: bash

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-artifacts
          path: |
            xnu-source/BUILD/**/*.kernel*
            xnu-source/BUILD/**/*.dSYM*
            xnu-source/BUILD/**/*.map
          if-no-files-found: warn
