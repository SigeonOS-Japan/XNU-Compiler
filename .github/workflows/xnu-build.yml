name: XNU Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-xnu:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Xcode Toolchain and SDK Fixes
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          echo "Selected Xcode version:"
          xcodebuild -version
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDK Path: $SDK_PATH"
          
          # 1. Create fallback mock for availability.pl
          LIBEXEC_DIR="$SDK_PATH/usr/local/libexec"
          sudo mkdir -p "$LIBEXEC_DIR"
          printf '#!/usr/bin/env perl\nuse strict;\nuse warnings;\n1;\n' | sudo tee "$LIBEXEC_DIR/availability.pl" > /dev/null
          sudo chmod +x "$LIBEXEC_DIR/availability.pl"

          # 2. Create missing SDK include directories to satisfy Clang's strict include checks
          sudo mkdir -p "$SDK_PATH/usr/local/include/kernel"
          sudo mkdir -p "$SDK_PATH/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/AppleFeatures"
          sudo mkdir -p "$SDK_PATH/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform"
        shell: bash

      - name: Clone Apple XNU Source
        run: |
          git clone --depth=1 https://github.com/apple-oss-distributions/xnu.git xnu-source

      - name: Build XNU Kernel
        run: |
          cd xnu-source
          # Disable both missing-include-dirs and reserved-identifier errors globally
          export RC_CFLAGS="-Wno-error=missing-include-dirs -Wno-missing-include-dirs -Wno-error=reserved-identifier -Wno-reserved-identifier"
          export CFLAGS="-Wno-error=missing-include-dirs -Wno-missing-include-dirs -Wno-error=reserved-identifier -Wno-reserved-identifier"
          export CXXFLAGS="-Wno-error=missing-include-dirs -Wno-missing-include-dirs -Wno-error=reserved-identifier -Wno-reserved-identifier"
          
          make SDKROOT=macosx KERNEL_CONFIGS=RELEASE ARCH_CONFIGS=X86_64 RC_DARWIN_KERNEL_VERSION="24.0.0" EXTRA_CFLAGS="-Wno-error=missing-include-dirs -Wno-missing-include-dirs -Wno-error=reserved-identifier -Wno-reserved-identifier"
        shell: bash

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-artifacts
          path: |
            xnu-source/BUILD/**/*.kernel*
            xnu-source/BUILD/**/*.dSYM*
            xnu-source/BUILD/**/*.map
          if-no-files-found: warn
