name: XNU Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-xnu:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Xcode Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          echo "Selected Xcode version:"
          xcodebuild -version
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDK Path: $SDK_PATH"
          
          # Fix for missing availability.pl in newer Xcode SDKs if building older XNU branches
          LIBEXEC_DIR="$SDK_PATH/usr/local/libexec"
          if [ ! -f "$LIBEXEC_DIR/availability.pl" ]; then
            echo "Creating fallback mock for availability.pl..."
            sudo mkdir -p "$LIBEXEC_DIR"
            sudo tee "$LIBEXEC_DIR/availability.pl" > /dev/null << 'EOF'
#!/usr/bin/env perl
use strict;
use warnings;
# Fallback mock wrapper for modern SDKs
1;
EOF
            sudo chmod +x "$LIBEXEC_DIR/availability.pl"
          fi
        shell: bash

      - name: Clone Apple XNU Source
        run: |
          git clone --depth=1 https://github.com/apple-oss-distributions/xnu.git xnu-source

      - name: Build XNU Kernel
        run: |
          cd xnu-source
          make SDKROOT=macosx KERNEL_CONFIGS=RELEASE ARCH_CONFIGS=X86_64 RC_DARWIN_KERNEL_VERSION="24.0.0"
        shell: bash

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-artifacts
          path: |
            xnu-source/BUILD/**/*.kernel*
            xnu-source/BUILD/**/*.dSYM*
            xnu-source/BUILD/**/*.map
          if-no-files-found: warn
