name: XNU Build Pipeline (Ventura Stable)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-xnu:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Xcode Toolchain and SDK Fixes
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          echo "Selected Xcode version:"
          xcodebuild -version
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDK Path: $SDK_PATH"
          
          # 1. Create fallback mock for availability.pl
          LIBEXEC_DIR="$SDK_PATH/usr/local/libexec"
          sudo mkdir -p "$LIBEXEC_DIR"
          printf '#!/usr/bin/env perl\nuse strict;\nuse warnings;\n1;\n' | sudo tee "$LIBEXEC_DIR/availability.pl" > /dev/null
          sudo chmod +x "$LIBEXEC_DIR/availability.pl"

          # 2. Create missing SDK include directories
          sudo mkdir -p "$SDK_PATH/usr/local/include/kernel"
          sudo mkdir -p "$SDK_PATH/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/AppleFeatures"
          sudo mkdir -p "$SDK_PATH/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform"
        shell: bash

      - name: Clone Apple XNU Source (Ventura Branch)
        run: |
          # Check out a stable pre-exclaves release branch (e.g., xnu-8792 / macOS 13 Ventura)
          git clone --depth=1 --branch xnu-8792.41.9 https://github.com/apple-oss-distributions/xnu.git xnu-source
        shell: bash

      - name: Inject Missing Private Headers & Stubs
        run: |
          cd xnu-source
          
          STUB_DIR="$PWD/custom_stubs"
          mkdir -p "$STUB_DIR/TrustCache"
          mkdir -p "$STUB_DIR/kern"

          # 1. TrustCache/API.h Stub
          cat << 'EOF' > "$STUB_DIR/TrustCache/API.h"
          #ifndef _TRUSTCACHE_API_H_
          #define _TRUSTCACHE_API_H_
          #include <stdint.h>
          typedef uint32_t TCCapabilities_t;
          typedef uint32_t TCType_t;
          typedef uint32_t TCQueryType_t;
          typedef void * TrustCacheQueryToken_t;
          #define kUUIDSize 16
          #define kTCEntryHashSize 20
          #endif
          EOF

          # 2. AppleFeatures.h Stub
          cat << 'EOF' > "$STUB_DIR/AppleFeatures.h"
          #ifndef _APPLE_FEATURES_H_
          #define _APPLE_FEATURES_H_
          #define APPLE_FEATURE_DEFAULT 1
          #endif
          EOF
          cp "$STUB_DIR/AppleFeatures.h" "$STUB_DIR/kern/AppleFeatures.h"

          # Mirror into export header directories
          mkdir -p BUILD/obj/EXPORT_HDRS/TrustCache BUILD/obj/EXPORT_HDRS/kern
          cp "$STUB_DIR/TrustCache/API.h" BUILD/obj/EXPORT_HDRS/TrustCache/API.h
          cp "$STUB_DIR/AppleFeatures.h" BUILD/obj/EXPORT_HDRS/AppleFeatures.h
          cp "$STUB_DIR/AppleFeatures.h" BUILD/obj/EXPORT_HDRS/kern/AppleFeatures.h
        shell: bash

      - name: Build XNU Kernel
        run: |
          cd xnu-source
          STUB_PATH="$PWD/custom_stubs"
          
          # Create a custom clang wrapper to strip out the deprecated auto-var flag
          mkdir -p "$STUB_PATH/bin"
          cat << 'EOF' > "$STUB_PATH/bin/clang"
          #!/bin/bash
          # Filter out the invalid argument
          ARGS=("$@")
          NEW_ARGS=()
          for arg in "${ARGS[@]}"; do
              if [ "$arg" != "-enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang" ]; then
                  NEW_ARGS+=("$arg")
              fi
          done
          exec /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang "${NEW_ARGS[@]}"
          EOF
          chmod +x "$STUB_PATH/bin/clang"
          
          # Put our wrapper at the front of the PATH
          export PATH="$STUB_PATH/bin:$PATH"
          
          # Force Clang flags and suppress warnings
          export RC_CFLAGS="-w -I$STUB_PATH"
          export CFLAGS="-w -I$STUB_PATH"
          export CXXFLAGS="-w -I$STUB_PATH"
          
          make SDKROOT=macosx \
               KERNEL_CONFIGS=RELEASE \
               ARCH_CONFIGS=X86_64 \
               RC_DARWIN_KERNEL_VERSION="22.0.0" \
               CC="$STUB_PATH/bin/clang" \
               EXTRA_CFLAGS="-w -I$STUB_PATH" \
               EXTRA_CXXFLAGS="-w -I$STUB_PATH" \
               OTHER_CFLAGS="-w -I$STUB_PATH"
        shell: bash

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-artifacts
          path: |
            xnu-source/BUILD/**/*.kernel*
            xnu-source/BUILD/**/*.dSYM*
            xnu-source/BUILD/**/*.map
          if-no-files-found: warn
