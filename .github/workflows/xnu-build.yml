name: XNU Fixed Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-xnu:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Xcode Toolchain and SDK Fixes
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          
          LIBEXEC_DIR="$SDK_PATH/usr/local/libexec"
          sudo mkdir -p "$LIBEXEC_DIR"
          printf '#!/usr/bin/env perl\nuse strict;\nuse warnings;\n1;\n' | sudo tee "$LIBEXEC_DIR/availability.pl" > /dev/null
          sudo chmod +x "$LIBEXEC_DIR/availability.pl"
        shell: bash

      - name: Clone Apple XNU Source (Ventura Tag)
        run: |
          git clone --depth=1 https://github.com/apple-oss-distributions/xnu.git xnu-source
          cd xnu-source
          git fetch origin tag xnu-8792.41.9 --depth=1
          git checkout xnu-8792.41.9
        shell: bash

      - name: Phase 1 - Stage and Install Export Headers (Pristine Environment)
        run: |
          cd xnu-source
          make SDKROOT=macosx ARCH_CONFIGS=X86_64 installhdrs
        shell: bash

      - name: Phase 2 Setup - Stub Headers, Symbol Implementations, and Wrappers
        run: |
          cd xnu-source
          
          # Create stub directories
          mkdir -p custom_stubs/include/os custom_stubs/include/firehose custom_stubs/lib custom_stubs/bin
          
          # 1. Comprehensive kernel stub header with full firehose chunk definitions
          cat << 'EOF' > custom_stubs/include/kernel_stubs.h
          #ifndef __KERNEL_STUBS_H__
          #define __KERNEL_STUBS_H__

          #include <stdint.h>
          #include <stddef.h>
          #include <stdbool.h>

          #define FIREHOSE_BUFFER_KERNEL_CHUNK_COUNT 2
          #define FIREHOSE_CHUNK_SIZE 4096
          #define FIREHOSE_BUFFER_KERNEL_DEFAULT_CHUNK_COUNT 2
          #define FIREHOSE_BUFFER_KERNEL_DEFAULT_IO_PAGES 1

          typedef struct firehose_tracepoint_s * firehose_tracepoint_t;
          typedef void* firehose_chunk_t;

          struct firehose_chunk_s {
              uint64_t fc_data[512];
          };

          #ifdef __cplusplus
          extern "C" {
          #endif

          extern void *__os_log_default;
          extern void *__os_log_internal;
          extern void *__os_log_internal_driverKit;
          extern char *__aslbufp;
          extern char *__msgbufp;
          extern bool startup_serial_logging_active;
          extern uint64_t startup_serial_num_procs;

          void __dummy_firehose(void);
          int __firehose_kernel_configuration_valid(uint64_t chunks, uint64_t iopages);
          void* __firehose_buffer_create(size_t *size);
          bool __firehose_merge_updates(uint64_t val);

          #ifdef __cplusplus
          }
          #endif

          #endif
          EOF

          # 2. Firehose specific headers
          cat << 'EOF' > custom_stubs/include/os/firehose_buffer_private.h
          #ifndef __OS_FIREHOSE_BUFFER_PRIVATE_H__
          #define __OS_FIREHOSE_BUFFER_PRIVATE_H__
          #include <kernel_stubs.h>
          static inline firehose_tracepoint_t __firehose_buffer_tracepoint_reserve(uint64_t a, uint32_t b, uint16_t c, uint32_t d, void *e) { return 0; }
          static inline void __firehose_buffer_tracepoint_flush(firehose_tracepoint_t a, uint64_t b) {}
          static inline int firehose_chunk_tracepoint_try_reserve(void *a, uint64_t b, uint32_t c, uint16_t d, uint32_t e, void *f) { return 0; }
          static inline void* firehose_chunk_tracepoint_begin(void *a, uint64_t b, uint16_t c, uint64_t d, long e) { return 0; }
          static inline void firehose_chunk_tracepoint_end(void *a, void *b, uint64_t c) {}
          #endif
          EOF

          cat << 'EOF' > custom_stubs/include/firehose/chunk_private.h
          #ifndef __FIREHOSE_CHUNK_PRIVATE_H__
          #define __FIREHOSE_CHUNK_PRIVATE_H__
          #include <kernel_stubs.h>
          #endif
          EOF

          # 3. Implement missing global symbols to satisfy the linker
          cat << 'EOF' > custom_stubs/lib/stubs_impl.c
          #include <kernel_stubs.h>

          void *__os_log_default = NULL;
          void *__os_log_internal = NULL;
          void *__os_log_internal_driverKit = NULL;
          char *__aslbufp = NULL;
          char *__msgbufp = NULL;
          bool startup_serial_logging_active = false;
          uint64_t startup_serial_num_procs = 0;

          void __dummy_firehose(void) {}
          void _firehose_trace_metadata(void) {}
          void _log_dmesg(void) {}
          void _log_payload_send(void) {}
          void _log_putc(void) {}
          void _log_putc_locked(void) {}
          void _logclose(void) {}
          void _logioctl(void) {}
          void _logopen(void) {}
          void _logread(void) {}
          void _logselect(void) {}
          void _logwakeup(void) {}
          void _os_log_create(void) {}
          void _os_log_disabled(void) {}
          void _os_log_with_args(void) {}
          void _oslogclose(void) {}
          void _oslogioctl(void) {}
          void _oslogopen(void) {}
          void _oslogselect(void) {}
          int __firehose_kernel_configuration_valid(uint64_t chunks, uint64_t iopages) { return 1; }
          void* __firehose_buffer_create(size_t *size) { return NULL; }
          bool __firehose_merge_updates(uint64_t val) { return false; }
          EOF

          clang -c custom_stubs/lib/stubs_impl.c -Icustom_stubs/include -o custom_stubs/lib/stubs_impl.o
          ar rcs custom_stubs/lib/libcustom_stubs.a custom_stubs/lib/stubs_impl.o
          rm custom_stubs/lib/stubs_impl.c custom_stubs/lib/stubs_impl.o

          # 4. Create the compiler wrapper script (skipping assembly files and header exports)
          cat << 'EOF' > custom_stubs/bin/clang-wrapper
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")/.." && pwd)"
          STUB_LIB="$SCRIPT_DIR/lib/libcustom_stubs.a"
          
          ARGS=("$@")
          NEW_ARGS=()
          IS_EXPORT_HDR=0
          IS_ASSEMBLY=0
          
          for arg in "${ARGS[@]}"; do
              if [[ "$arg" == *"EXPORT_HDRS"* ]]; then
                  IS_EXPORT_HDR=1
              fi
              if [[ "$arg" == *.s ]] || [[ "$arg" == *.S ]]; then
                  IS_ASSEMBLY=1
              fi
              if [ "$arg" != "-enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang" ]; then
                  NEW_ARGS+=("$arg")
              fi
          done
          
          TOOL="clang"
          if [[ "$(basename "$0")" == *"++"* ]]; then
              TOOL="clang++"
          fi
          
          if [ "$IS_EXPORT_HDR" -eq 1 ] || [ "$IS_ASSEMBLY" -eq 1 ]; then
              exec /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/$TOOL "${NEW_ARGS[@]}"
          else
              exec /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/$TOOL -w -Wno-error -include "$SCRIPT_DIR/include/kernel_stubs.h" -I"$SCRIPT_DIR/include" "$STUB_LIB" "${NEW_ARGS[@]}"
          fi
          EOF
          chmod +x custom_stubs/bin/clang-wrapper
          ln -sf clang-wrapper custom_stubs/bin/clang
          ln -sf clang-wrapper custom_stubs/bin/clang++

          # Fix uio alignments across C files
          find . -name "*.c" 2>/dev/null | xargs sed -i '' 's/uio_stackbuf_t[[:space:]]*uio_buf/char uio_buf/g' || true
        shell: bash

      - name: Phase 2 - Build XNU Kernel Target
        run: |
          cd xnu-source
          STUB_PATH="$PWD/custom_stubs"
          export PATH="$STUB_PATH/bin:$PATH"
          export CC="$STUB_PATH/bin/clang"
          export CXX="$STUB_PATH/bin/clang++"
          
          STUB_INC="$STUB_PATH/include"
          STUB_LIB="$STUB_PATH/lib"
          export RC_CFLAGS="-w -Wno-error -include $STUB_INC/kernel_stubs.h -I$STUB_INC"
          export CFLAGS="-w -Wno-error -include $STUB_INC/kernel_stubs.h -I$STUB_INC"
          export CXXFLAGS="-w -Wno-error -include $STUB_INC/kernel_stubs.h -I$STUB_INC"
          
          make SDKROOT=macosx \
               KERNEL_CONFIGS=RELEASE \
               ARCH_CONFIGS=X86_64 \
               RC_DARWIN_KERNEL_VERSION="22.0.0" \
               CC="$CC" CXX="$CXX" \
               HOST_CC="$CC" \
               HOST_CFLAGS="-std=gnu89 -w -Wno-error -include $STUB_INC/kernel_stubs.h -I$STUB_INC" \
               BUILD_WERROR=0 \
               RC_CFLAGS="$RC_CFLAGS" \
               EXTRA_CFLAGS="$CFLAGS" \
               EXTRA_CXXFLAGS="$CFLAGS" \
               OTHER_CFLAGS="$CFLAGS" \
               build
        shell: bash

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-artifacts
          path: |
            xnu-source/BUILD/**/*.kernel*
            xnu-source/BUILD/**/*.dSYM*
            xnu-source/BUILD/**/*.map
          if-no-files-found: warn
