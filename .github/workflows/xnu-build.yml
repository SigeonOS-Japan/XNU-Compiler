name: XNU Fixed Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-xnu:
    runs-on: macos-latest

    steps:
      - name: Configure Xcode Toolchain and SDK Fixes
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          
          # Create fallback mock for availability.pl script expected by build system
          LIBEXEC_DIR="$SDK_PATH/usr/local/libexec"
          sudo mkdir -p "$LIBEXEC_DIR"
          printf '#!/usr/bin/env perl\nuse strict;\nuse warnings;\n1;\n' | sudo tee "$LIBEXEC_DIR/availability.pl" > /dev/null
          sudo chmod +x "$LIBEXEC_DIR/availability.pl"
        shell: bash

      - name: Clone Apple XNU Source (Ventura Tag)
        run: |
          git clone --depth=1 https://github.com/apple-oss-distributions/xnu.git xnu-source
          cd xnu-source
          git fetch origin tag xnu-8792.41.9 --depth=1
          git checkout xnu-8792.41.9
        shell: bash

      - name: Setup Global Clang/CXX Wrapper
        run: |
          cd xnu-source
          STUB_DIR="$PWD/custom_stubs"
          mkdir -p "$STUB_DIR/bin"

          # Create robust wrapper for both clang and clang++
          cat << 'EOF' > "$STUB_DIR/bin/clang-wrapper"
          #!/bin/bash
          ARGS=("$@")
          NEW_ARGS=()
          for arg in "${ARGS[@]}"; do
              if [ "$arg" != "-enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang" ]; then
                  NEW_ARGS+=("$arg")
              fi
          done
          # Determine if called as clang++ or clang
          TOOL="clang"
          if [[ "$(basename "$0")" == *"++"* ]]; then
              TOOL="clang++"
          fi
          exec /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/$TOOL "${NEW_ARGS[@]}"
          EOF
          chmod +x "$STUB_DIR/bin/clang-wrapper"
          
          # Symlink both names
          ln -sf clang-wrapper "$STUB_DIR/bin/clang"
          ln -sf clang-wrapper "$STUB_DIR/bin/clang++"
        shell: bash

      - name: Phase 1 - Stage and Install Export Headers
        run: |
          cd xnu-source
          STUB_PATH="$PWD/custom_stubs"
          export PATH="$STUB_PATH/bin:$PATH"
          export CC="$STUB_PATH/bin/clang"
          export CXX="$STUB_PATH/bin/clang++"
          
          make SDKROOT=macosx \
               ARCH_CONFIGS=X86_64 \
               CC="$CC" CXX="$CXX" \
               installhdrs
        shell: bash

      - name: Phase 2 - Build XNU Kernel Target (Bypass Bootstrap Link Error)
        run: |
          cd xnu-source
          STUB_PATH="$PWD/custom_stubs"
          export PATH="$STUB_PATH/bin:$PATH"
          export CC="$STUB_PATH/bin/clang"
          export CXX="$STUB_PATH/bin/clang++"
          
          mkdir -p BUILD/obj/EXPORT_HDRS/libsa
          
          export RC_CFLAGS="-w -Wno-error=missing-include-dirs -Wno-error"
          export CFLAGS="-w -Wno-error=missing-include-dirs -Wno-error"
          export CXXFLAGS="-w -Wno-error=missing-include-dirs -Wno-error"
          
          make SDKROOT=macosx \
               KERNEL_CONFIGS=RELEASE \
               ARCH_CONFIGS=X86_64 \
               RC_DARWIN_KERNEL_VERSION="22.0.0" \
               CC="$CC" CXX="$CXX" \
               HOST_CC="$CC" \
               HOST_CFLAGS="-std=gnu89 -w -Wno-error" \
               OTHER_LDFLAGS="-Wl,-w" \
               RC_CFLAGS="$RC_CFLAGS" \
               EXTRA_CFLAGS="$CFLAGS" \
               EXTRA_CXXFLAGS="$CXXFLAGS" \
               OTHER_CFLAGS="$CFLAGS"
        shell: bash

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-artifacts
          path: |
            xnu-source/BUILD/**/*.kernel*
            xnu-source/BUILD/**/*.dSYM*
            xnu-source/BUILD/**/*.map
          if-no-files-found: warn
