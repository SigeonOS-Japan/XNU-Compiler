name: XNU Fixed Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-xnu:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Xcode Toolchain and SDK Fixes
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          
          LIBEXEC_DIR="$SDK_PATH/usr/local/libexec"
          sudo mkdir -p "$LIBEXEC_DIR"
          printf '#!/usr/bin/env perl\nuse strict;\nuse warnings;\n1;\n' | sudo tee "$LIBEXEC_DIR/availability.pl" > /dev/null
          sudo chmod +x "$LIBEXEC_DIR/availability.pl"
        shell: bash

      - name: Clone Apple XNU Source (Ventura Tag)
        run: |
          git clone --depth=1 https://github.com/apple-oss-distributions/xnu.git xnu-source
          cd xnu-source
          git fetch origin tag xnu-8792.41.9 --depth=1
          git checkout xnu-8792.41.9
        shell: bash

      - name: Inject Missing Headers and Patch Source Tree
        run: |
          cd xnu-source
          
          # 1. Place firehose_buffer_private.h directly into libkern/os/ so it's always found
          mkdir -p libkern/os
          cat << 'EOF' > libkern/os/firehose_buffer_private.h
          #ifndef __OS_FIREHOSE_BUFFER_PRIVATE_H__
          #define __OS_FIREHOSE_BUFFER_PRIVATE_H__
          // Stubbed private header for XNU build compatibility
          #endif
          EOF

          # 2. Fix uio alignments globally across C files
          find . -name "*.c" 2>/dev/null | xargs sed -i '' 's/uio_stackbuf_t[[:space:]]*uio_buf/char uio_buf/g' || true
        shell: bash

      - name: Setup Global Clang/CXX Wrapper and Sanitizer
        run: |
          cd xnu-source
          STUB_DIR="$PWD/custom_stubs"
          mkdir -p "$STUB_DIR/bin"

          # Create a wrapper that automatically strips kernelContent out of dynamically generated iig.cpp files
          cat << 'EOF' > "$STUB_DIR/bin/clang-wrapper"
          #!/bin/bash
          ARGS=("$@")
          NEW_ARGS=()
          for arg in "${ARGS[@]}"; do
              if [ "$arg" != "-enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang" ]; then
                  NEW_ARGS+=("$arg")
              fi
              # If compiling an iig.cpp file, purge kernelContent references on the fly
              if [[ "$arg" == *.iig.cpp ]]; then
                  sed -i '' '/kernelContent/d' "$arg" 2>/dev/null || true
              fi
          done
          TOOL="clang"
          if [[ "$(basename "$0")" == *"++"* ]]; then
              TOOL="clang++"
          fi
          exec /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/$TOOL -w -Wno-error "${NEW_ARGS[@]}"
          EOF
          chmod +x "$STUB_DIR/bin/clang-wrapper"
          
          ln -sf clang-wrapper "$STUB_DIR/bin/clang"
          ln -sf clang-wrapper "$STUB_DIR/bin/clang++"
        shell: bash

      - name: Phase 1 - Stage and Install Export Headers
        run: |
          cd xnu-source
          STUB_PATH="$PWD/custom_stubs"
          export PATH="$STUB_PATH/bin:$PATH"
          export CC="$STUB_PATH/bin/clang"
          export CXX="$STUB_PATH/bin/clang++"
          
          make SDKROOT=macosx \
               ARCH_CONFIGS=X86_64 \
               CC="$CC" CXX="$CXX" \
               installhdrs
        shell: bash

      - name: Phase 2 - Build XNU Kernel Target
        run: |
          cd xnu-source
          STUB_PATH="$PWD/custom_stubs"
          export PATH="$STUB_PATH/bin:$PATH"
          export CC="$STUB_PATH/bin/clang"
          export CXX="$STUB_PATH/bin/clang++"
          
          mkdir -p BUILD/obj/EXPORT_HDRS/libsa
          
          export RC_CFLAGS="-w -Wno-error"
          export CFLAGS="-w -Wno-error"
          export CXXFLAGS="-w -Wno-error"
          
          make SDKROOT=macosx \
               KERNEL_CONFIGS=RELEASE \
               ARCH_CONFIGS=X86_64 \
               RC_DARWIN_KERNEL_VERSION="22.0.0" \
               CC="$CC" CXX="$CXX" \
               HOST_CC="$CC" \
               HOST_CFLAGS="-std=gnu89 -w -Wno-error" \
               BUILD_WERROR=0 \
               RC_CFLAGS="$RC_CFLAGS" \
               EXTRA_CFLAGS="$CFLAGS" \
               EXTRA_CXXFLAGS="$CFLAGS" \
               OTHER_CFLAGS="$CFLAGS" \
               build
        shell: bash

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-artifacts
          path: |
            xnu-source/BUILD/**/*.kernel*
            xnu-source/BUILD/**/*.dSYM*
            xnu-source/BUILD/**/*.map
          if-no-files-found: warn
